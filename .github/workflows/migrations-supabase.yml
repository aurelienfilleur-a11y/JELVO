name: Migrations Supabase

# Applique les fichiers de `supabase/` à la base réelle, puis recommite
# l'instantané du schéma.
#
#
# POURQUOI JAMAIS SUR UNE PULL REQUEST
#
# Le dépôt est **public**. Un job déclenché par une pull request s'exécuterait
# avec du code proposé par n'importe qui ; lui donner `SUPABASE_DB_URL`
# reviendrait à publier la chaîne de connexion — il suffirait d'ajouter un
# `echo` au workflow dans la PR. Le déclencheur est donc `push` sur `main`
# uniquement, jamais `pull_request` ni `pull_request_target`.
#
# Conséquence assumée : une migration n'est éprouvée contre la vraie base
# qu'après fusion. Le filet avant fusion reste `supabase/verification/`, qui
# tourne sur une base jetable sans aucun secret.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations-supabase.yml'
  # Pour rattraper une base à la main, sans avoir à pousser un commit vide.
  workflow_dispatch:

permissions:
  contents: write

# Deux applications simultanées se marcheraient dessus : la table de suivi
# n'est consultée qu'au début de chaque fichier.
concurrency:
  group: migrations-supabase
  cancel-in-progress: false

jobs:
  appliquer:
    name: Appliquer et relever le schéma
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer psql au besoin
        run: |
          command -v psql >/dev/null && exit 0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      # Épure et contrôle une fois pour toutes, puis republie la valeur propre
      # pour les étapes suivantes. Sans cela, l'extraction du schéma
      # reprendrait le secret brut et retomberait sur le même défaut que
      # l'application des migrations.
      - name: Normaliser la chaîne de connexion
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          . supabase/verification/connexion.sh
          if ! url=$(normaliser_url_connexion "$SUPABASE_DB_URL"); then
            echo "::error::Chaîne de connexion inutilisable, voir ci-dessus."
            exit 1
          fi
          # `add-mask` a déjà été posé par la fonction : écrire la valeur dans
          # l'environnement du job ne l'expose donc pas dans les journaux.
          echo "SUPABASE_DB_URL=$url" >> "$GITHUB_ENV"
          echo "Connexion à $(masquer_mot_de_passe "$url")"

      # Une connexion refusée ressemble à tout et à rien : `appliquer.sh`
      # s'arrête à sa première commande, sans avoir appliqué une seule
      # migration, et le journal ne montre qu'un `FATAL` de libpq. Trois
      # échecs précédents n'ayant porté que sur la publication de
      # l'instantané, la tentation est grande de conclure pareil — c'est
      # arrivé, et la colonne `profiles.avatar_preset` est restée absente en
      # production pendant que l'application l'écrivait déjà.
      - name: Éprouver la connexion
        run: |
          if ! psql "$SUPABASE_DB_URL" -Atq --no-psqlrc -c 'select 1' >/dev/null 2>erreur.log; then
            cat erreur.log
            if grep -qi 'password authentication failed' erreur.log; then
              echo "::error title=Connexion refusée::Le secret SUPABASE_DB_URL n'authentifie plus (mot de passe refusé). AUCUNE migration n'a été appliquée. Régénérez la chaîne de connexion depuis le tableau de bord Supabase (Project Settings, Database, Connection string) et remettez-la dans les secrets du dépôt."
            else
              echo "::error title=Base injoignable::AUCUNE migration n'a été appliquée — voir l'erreur ci-dessus."
            fi
            exit 1
          fi
          echo "Connexion établie."

      # Le script n'applique que ce dont l'empreinte a changé, chaque fichier
      # dans sa propre transaction. Voir son en-tête.
      - name: Appliquer les migrations
        id: appliquer
        run: supabase/verification/appliquer.sh

      - name: Relever le schéma réel
        id: relever
        run: |
          psql "$SUPABASE_DB_URL" -At --no-psqlrc \
            -f supabase/verification/extraire_schema.sql \
            > supabase/schema_actuel.sql
          echo "$(wc -l < supabase/schema_actuel.sql) lignes relevées."

      # Qu'il atteigne `main` ou non, le relevé doit rester récupérable : un
      # refus de poussée le perdait purement et simplement, et la seule façon
      # de le revoir était de relancer le workflow.
      #
      # La condition porte sur l'étape de relevé, et non sur `always()` : le
      # fichier existe déjà dans le dépôt, et le joindre sans qu'il ait été
      # régénéré donnerait un instantané périmé sous une étiquette fraîche.
      - name: Conserver l'instantané en pièce jointe
        if: steps.relever.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: schema_actuel
          path: supabase/schema_actuel.sql
          if-no-files-found: warn

      # `[skip ci]` évite la boucle : ce commit touche `supabase/`, qui est
      # justement le chemin qui déclenche ce workflow. Il n'emporte aucun code
      # Dart, donc ne pas redéployer les pages est sans conséquence.
      #
      #
      # POURQUOI CETTE ÉTAPE PEUT ÊTRE REFUSÉE
      #
      # `main` exige désormais la vérification « Compiler la version web » —
      # c'est elle qui rend l'auto-merge armable. Mais une règle de dépôt
      # s'applique **à toute poussée**, y compris celle-ci, qui n'est pas une
      # fusion et n'a donc aucune vérification à présenter. GitHub répond
      # `GH013` et refuse.
      #
      # Le remède ne se code pas : il faut ajouter `github-actions` à la liste
      # de contournement de la règle (Settings → Rules → la règle de `main` →
      # « Bypass list »). Le message ci-dessous le dit en toutes lettres,
      # parce que l'échec brut désigne le mauvais coupable : il ressemble à
      # une migration ratée alors que les migrations, elles, sont passées.
      - name: Publier l'instantané du schéma
        id: instantane
        run: |
          if git diff --quiet -- supabase/schema_actuel.sql; then
            echo "Schéma inchangé, rien à commiter."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/schema_actuel.sql
          git commit -m 'Relève le schéma réel de la base [skip ci]'

          if git push origin HEAD:main 2>push.log; then
            echo "Instantané publié."
            exit 0
          fi

          cat push.log
          echo "refuse=1" >> "$GITHUB_OUTPUT"
          echo "::error title=Instantané non publié::Les migrations SONT appliquées ; seul le relevé du schéma n'a pas pu être poussé sur main, la règle de protection refusant toute poussée directe. Remède : ajouter github-actions à la liste de contournement de la règle (Settings, Rules, main, Bypass list). En attendant, le relevé est en pièce jointe de ce job, sous le nom schema_actuel."
          exit 1

      - name: Résumé
        if: always()
        run: |
          {
            echo '## Migrations Supabase'
            echo
            echo 'Les fichiers listés dans `supabase/migrations.txt` ont été'
            echo 'confrontés à la table de suivi `jelvo_migrations.appliquees` :'
            echo 'seuls ceux dont l’empreinte a changé sont rejoués.'
            echo
            if [ "${{ steps.appliquer.outcome }}" != 'success' ]; then
              echo '> **Aucune migration n’a été appliquée.** Le job s’est'
              echo '> arrêté avant `appliquer.sh` — connexion refusée, le plus'
              echo '> souvent parce que `SUPABASE_DB_URL` n’authentifie plus.'
              echo '>'
              echo '> Ce n’est **pas** le cas habituel où seul l’instantané'
              echo '> est refusé : ici la base n’a rien reçu.'
            elif [ "${{ steps.instantane.outputs.refuse }}" = '1' ]; then
              echo '> **Les migrations sont appliquées.** Ce qui a échoué, c’est'
              echo '> la publication de `supabase/schema_actuel.sql` sur `main` :'
              echo '> la règle de protection refuse toute poussée directe.'
              echo '>'
              echo '> Remède, une fois pour toutes : ajouter `github-actions` à'
              echo '> la liste de contournement de la règle.'
              echo '>'
              echo '> Le relevé est en pièce jointe de ce job (`schema_actuel`).'
            else
              echo 'L’instantané du schéma vit dans `supabase/schema_actuel.sql`.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
